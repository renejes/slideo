[package]
name = "slideo"
version = "0.1.0"
description = "Lokale, code-freie, MCP-native Desktop-App für Präsentationen"
authors = ["Slideo"]
edition = "2021"
rust-version = "1.77"

# Tauri 2 erwartet eine lib + thin main.rs.
[lib]
name = "slideo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: Token-/Zone-Reihenfolge bleibt für saubere Git-Diffs erhalten.
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
# Schlanker zip-Build: nur Deflate, keine nativen bzip2/zstd-Abhängigkeiten.
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
# MCP/IPC: lokaler Socket-Server (async, in der App) + Hilfsmittel.
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time", "process"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
# Lizenzierung: Polar-Lizenzschlüssel validieren/aktivieren (nur HTTPS-GET/POST).
# rustls statt native-tls → keine OpenSSL-Systemabhängigkeit (sauberer Cross-Platform-Build).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Stabiler Geräte-Fingerprint (macOS IOPlatformUUID / Windows MachineGuid / Linux machine-id).
machine-uid = "0.5"
sha2 = "0.10"

[features]
# Standardmäßig keine zusätzlichen Features.
default = []
